<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>
  @page { size: A4; margin: 20mm 15mm; }
  body { font-family: 'DejaVu Sans', sans-serif; font-size: 10pt; color: #333; margin: 0; padding: 0; }
  .header { border-bottom: 2px solid #1a1a1a; padding-bottom: 15px; margin-bottom: 20px; }
  .header h1 { margin: 0; font-size: 18pt; color: #1a1a1a; }
  .header .company-info { color: #666; font-size: 8pt; margin-top: 3px; }
  .header .title { float: right; font-size: 16pt; font-weight: bold; color: #d4a017; }
  .clearfix::after { content: ""; display: table; clear: both; }
  .info-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  .info-table td { vertical-align: top; padding: 3px 5px; }
  .info-table td:first-child { width: 50%; }
  .info-table .label { color: #888; font-size: 8pt; text-transform: uppercase; }
  .info-table .value { font-size: 9pt; }
  table.items { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
  table.items th { background: #1a1a1a; color: #fff; padding: 6px 8px; text-align: left; font-size: 8pt; text-transform: uppercase; }
  table.items td { padding: 5px 8px; border-bottom: 1px solid #ddd; font-size: 9pt; }
  table.items td.right { text-align: right; }
  table.items tr:last-child td { border-bottom: 2px solid #1a1a1a; }
  .totals { width: 300px; margin-left: auto; }
  .totals table { width: 100%; }
  .totals td { padding: 3px 8px; font-size: 9pt; }
  .totals td.right { text-align: right; }
  .totals .grand-total td { font-size: 12pt; font-weight: bold; border-top: 2px solid #1a1a1a; padding-top: 5px; }
  .footer { border-top: 1px solid #ddd; margin-top: 30px; padding-top: 10px; font-size: 7pt; color: #999; text-align: center; }
  .notes { border: 1px solid #ddd; padding: 8px; margin-top: 15px; font-size: 8pt; color: #666; }
</style>
</head>
<body>
<div class="header">
  <table style="width: 100%; border-collapse: collapse;">
    <tr>
      <td style="width: 80px; vertical-align: middle;">
        <img src="ebee_logo.png" alt="Logo" style="width: 70px; height: auto; display: block;"/>
      </td>
      <td style="vertical-align: middle;">
        <h1 th:text="${company.name}">Company Name</h1>
        <div class="company-info">
          <div th:text="${company.address}">Address</div>
          <div th:text="${company.phone}">Phone</div>
          <div th:text="${company.email}">Email</div>
          <div th:if="${company.registration}" th:text="'Reg: ' + ${company.registration}">Reg</div>
        </div>
      </td>
      <td style="width: 140px; text-align: right; vertical-align: middle;">
        <div class="title" style="float: none;" th:text="${title}">INVOICE</div>
      </td>
    </tr>
  </table>
</div>

<table class="info-table">
  <tr>
    <td>
      <div class="label">Order Number</div>
      <div class="value" th:text="${orderNumber}">ORD-001</div>
    </td>
    <td>
      <div class="label">Date</div>
      <div class="value" th:text="${#temporals.format(createdAt, 'MMM dd, yyyy')}">Jul 19, 2026</div>
      <div class="value" th:text="${#temporals.format(createdAt, 'HH:mm')}">14:30</div>
    </td>
  </tr>
  <tr>
    <td>
      <div class="label">Customer</div>
      <div class="value" th:text="${customerName}">Customer Name</div>
      <div class="value" th:if="${customerPhone}" th:text="${customerPhone}">Phone</div>
      <div class="value" th:if="${customerAddress}" th:text="${customerAddress}">Address</div>
    </td>
    <td>
      <div class="label" th:if="${agentName}">Agent</div>
      <div class="value" th:if="${agentName}" th:text="${agentName}">Agent Name</div>
      <div class="value" th:if="${agentCode}" th:text="'Code: ' + ${agentCode}">Code</div>
    </td>
  </tr>
</table>

<table class="items">
  <thead>
    <tr>
      <th style="width: 50px;">#</th>
      <th>Item</th>
      <th style="width: 60px;">Code</th>
      <th style="width: 50px; text-align: right;">Qty</th>
      <th style="width: 80px; text-align: right;">Unit Price</th>
      <th style="width: 80px; text-align: right;">Total</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="item, stat : ${items}">
      <td th:text="${stat.count}">1</td>
      <td th:text="${item.productName}">Product</td>
      <td th:text="${item.productCode}">CODE</td>
      <td class="right" th:text="${item.quantity}">1</td>
      <td class="right" th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}">0.00</td>
      <td class="right" th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</td>
    </tr>
  </tbody>
</table>

<div class="totals">
  <table>
    <tr>
      <td>Subtotal</td>
      <td class="right" th:text="${#numbers.formatDecimal(subtotal, 1, 2)}">0.00</td>
    </tr>
    <tr th:if="${discountTotal > 0}">
      <td>Discount</td>
      <td class="right" th:text="'-' + ${#numbers.formatDecimal(discountTotal, 1, 2)}">0.00</td>
    </tr>
    <tr class="grand-total">
      <td>Total</td>
      <td class="right" th:text="${#numbers.formatDecimal(totalAmount, 1, 2)}">0.00</td>
    </tr>
  </table>
</div>

<div th:if="${notes}" class="notes" th:text="${notes}">Notes</div>

<div class="footer">
  <p>This is a computer-generated invoice.</p>
</div>
</body>
</html>
