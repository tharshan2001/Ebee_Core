<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>
  @page { size: A4; margin: 20mm 15mm; }
  body { font-family: 'DejaVu Sans', sans-serif; font-size: 10pt; color: #333; margin: 0; padding: 0; }
  .header { border-bottom: 2px solid #1a1a1a; padding-bottom: 15px; margin-bottom: 20px; }
  .header h1 { margin: 0; font-size: 18pt; color: #1a1a1a; }
  .header .company-info { color: #666; font-size: 8pt; margin-top: 3px; }
  .header .title { float: right; font-size: 16pt; font-weight: bold; color: #d4a017; }
  .clearfix::after { content: ""; display: table; clear: both; }
  .info-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  .info-table td { vertical-align: top; padding: 5px 8px; font-size: 9pt; }
  .info-table .label { color: #888; font-size: 8pt; text-transform: uppercase; margin-bottom: 2px; }
  .info-table .value { font-size: 9pt; line-height: 1.4; }
  .amount-box { border: 2px solid #1a1a1a; padding: 20px; text-align: center; margin: 25px 0; }
  .amount-box .label { font-size: 8pt; color: #888; text-transform: uppercase; margin-bottom: 4px; }
  .amount-box .value { font-size: 22pt; font-weight: bold; color: #d4a017; }
  .status-box { display: inline-block; padding: 4px 12px; font-size: 8pt; font-weight: bold; text-transform: uppercase; }
  .status-pending { background: #fff3cd; color: #856404; }
  .status-processed { background: #d4edda; color: #155724; }
  .footer { border-top: 1px solid #ddd; margin-top: 40px; padding-top: 12px; font-size: 7pt; color: #999; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <table style="width: 100%; border-collapse: collapse;">
    <tr>
      <td style="width: 80px; vertical-align: middle;">
        <img src="ebee_logo.png" alt="Logo" style="width: 70px; height: auto; display: block;"/>
      </td>
      <td style="vertical-align: middle;">
        <h1 th:text="${company.name}">Company Name</h1>
        <div class="company-info">
          <div th:text="${company.address}">Address</div>
          <div th:text="${company.phone}">Phone</div>
          <div th:text="${company.email}">Email</div>
        </div>
      </td>
      <td style="width: 160px; text-align: right; vertical-align: middle;">
        <div class="title" style="float: none;">PAYOUT STATEMENT</div>
      </td>
    </tr>
  </table>
</div>

<table class="info-table">
  <tr>
    <td>
      <div class="label">Agent</div>
      <div class="value" th:text="${agentName}">Agent Name</div>
    </td>
    <td>
      <div class="label">Payout ID</div>
      <div class="value" th:text="${payoutId}">ID</div>
    </td>
  </tr>
  <tr>
    <td>
      <div class="label">Date</div>
      <div class="value" th:text="${#temporals.format(createdAt, 'MMM dd, yyyy')}">Jul 19, 2026</div>
    </td>
    <td>
      <div class="label">Status</div>
      <div class="status-box" th:classappend="${status == 'PROCESSED'} ? 'status-processed' : 'status-pending'" th:text="${status}">PENDING</div>
    </td>
  </tr>
</table>

<div class="amount-box">
  <div class="label">Total Payout Amount</div>
  <div class="value" th:text="${#numbers.formatDecimal(totalAmount, 1, 2)}">0.00</div>
</div>

<div class="footer">
  <p>This is a computer-generated payout statement.</p>
</div>
</body>
</html>
