spring:
  application:
    name: ebee

  mvc:
    throw-exception-if-no-handler-found: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ebee_db}
    username: ${DB_USERNAME:antonabitharshan}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # format_sql: true  # Dev only; enable for debugging SQL
        jdbc:
          lob:
            # Hibernate 5.x compatibility; test for removal when upgrading Hibernate
            non_contextual_creation: true
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${APP_GMAIL_USERNAME:}
    password: ${APP_GMAIL_PASSWORD:}
    from: ${APP_GMAIL_USERNAME:}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate: true  # Should be removed in production; only needed for initial Flyway setup
    validate-on-migrate: true


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

aws:
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  region: ${AWS_REGION:eu-north-1}
  bucket-name: ${AWS_BUCKET_NAME:}

server:
  port: ${SERVER_PORT:8085}

jwt:
  secret: ${JWT_SECRET}
  reset-secret: ${JWT_RESET_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION:604800000}

notification:
  push:
    enabled: ${NOTIFICATION_PUSH_ENABLED:false}
    project-id: ${FCM_PROJECT_ID:}
    config-path: ${FIREBASE_CONFIG_PATH:}
  sms:
    api-base-url: ${DIALOG_SMS_API_URL:}
    username: ${DIALOG_SMS_USERNAME:}
    password: ${DIALOG_SMS_PASSWORD:}
    default-mask: ${DIALOG_SMS_MASK:KISMET PLUS}
    default-campaign: ${DIALOG_SMS_CAMPAIGN:Notification}

whatsapp:
  api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:ebee_wh_verify_2024}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8085}
  backup:
    dir: ${BACKUP_DIR:${user.dir}/backups}
  print:
    company-name: ${PRINT_COMPANY_NAME:Kismet Plus (Pvt) Ltd}
    company-address: ${PRINT_COMPANY_ADDRESS:Vavuniya}
    company-phone: ${PRINT_COMPANY_PHONE:}
    company-email: ${PRINT_COMPANY_EMAIL:}
    company-registration: ${PRINT_COMPANY_REGISTRATION:}
    logo-url: ${PRINT_LOGO_URL:https://s3.eu-north-1.amazonaws.com/pathfinder-app-media/products/8bced4aa-90b9-4a5b-a609-4deaad146fe3/eeb6cb2f-dbc3-4aec-a9a2-cb43a899c673-Untitled_-_05_June_2026_at_19.30.26_copy.png}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:super@ebee.lk}
    phone-number: ${SUPER_ADMIN_PHONE:}
    password: ${SUPER_ADMIN_PASSWORD:}
    first-name: Super
    last-name: Admin
  ip-whitelist:
    super-admin-ips: ${SUPER_ADMIN_IPS:}

rate-limiting:
  login:
    max-attempts: 10
    window-minutes: 15
  generic:
    max-requests: 30
    window-minutes: 15
  ip:
    max-requests: 200
    window-minutes: 1

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %X{correlationId} %logger{36} - %msg%n"
  level:
    com.ebee: INFO
    org.springframework.security: INFO
