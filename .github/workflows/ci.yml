name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ebee_test
          POSTGRES_USER: ebee
          POSTGRES_PASSWORD: ebee_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Compile
        run: ./mvnw compile -q --batch-mode --no-transfer-progress

      - name: Run tests
        run: ./mvnw test --batch-mode --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ebee_test
          SPRING_DATASOURCE_USERNAME: ebee
          SPRING_DATASOURCE_PASSWORD: ebee_test_pass
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          REDIS_HOST: localhost
          REDIS_PORT: 16379

      - name: Print test reports
        if: failure()
        run: |
          find target/surefire-reports -name "*.txt" 2>/dev/null | while read f; do
            echo "=== $(basename $f) ==="
            head -50 "$f"
          done
          find target/surefire-reports -name "*.xml" 2>/dev/null | while read f; do
            if grep -q 'failures="[1-9]\|errors="[1-9]' "$f" 2>/dev/null; then
              echo "=== FAILED: $(basename $f) ==="
              grep -A2 '<failure\|<error' "$f" | head -30
            fi
          done

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JaCoCo report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
