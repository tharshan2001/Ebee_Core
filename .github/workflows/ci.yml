name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ebee_test
          POSTGRES_USER: ebee
          POSTGRES_PASSWORD: ebee_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Compile
        run: ./mvnw compile -q --batch-mode --no-transfer-progress

      - name: Run tests
        run: ./mvnw test --batch-mode --no-transfer-progress -Dspring.datasource.url=jdbc:postgresql://localhost:5432/ebee_test -Dspring.datasource.username=ebee -Dspring.datasource.password=ebee_test_pass -Dspring.datasource.driver-class-name=org.postgresql.Driver -Dspring.profiles.active=test
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 16379

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JaCoCo report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
