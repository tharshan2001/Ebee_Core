<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<style>
  @page { size: 100mm 60mm; margin: 5mm; }
  body { font-family: 'DejaVu Sans', sans-serif; font-size: 9pt; color: #333; margin: 0; padding: 0; }
  .label { border: 1px solid #ccc; padding: 8px; height: calc(100% - 16px); box-sizing: border-box; }
  .product-name { font-size: 11pt; font-weight: bold; color: #1a1a1a; margin-bottom: 4px; }
  .sku { font-size: 8pt; color: #888; margin-bottom: 2px; }
  .price { font-size: 14pt; font-weight: bold; color: #d4a017; margin-bottom: 4px; }
  .meta { font-size: 7pt; color: #999; }
</style>
</head>
<body>
<div class="label">
  <table style="width: 100%; border-collapse: collapse; margin-bottom: 4px;">
    <tr>
      <td style="width: 26px; vertical-align: middle;">
        <img src="ebee_logo.png" alt="Logo" style="width: 22px; height: auto; display: block;"/>
      </td>
      <td style="vertical-align: middle;">
        <div class="product-name" style="margin-bottom: 0;" th:text="${productName}">Product Name</div>
      </td>
    </tr>
  </table>
  <div class="sku" th:text="'Item code: ' + ${itemCode}">CODE</div>
  <div class="price" th:text="${#numbers.formatDecimal(price, 1, 2)}">0.00</div>
  <div class="meta">
    <span th:if="${category}" th:text="'Cat: ' + ${category}">Category</span>
    <span th:if="${brand}" th:text="' | ' + ${brand}">Brand</span>
  </div>
</div>
</body>
</html>
