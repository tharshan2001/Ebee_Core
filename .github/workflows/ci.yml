name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ebee_db_test
          POSTGRES_USER: ebee
          POSTGRES_PASSWORD: ebee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Setup .env for tests
        run: |
          cat > .env << 'EOF'
          DB_URL=jdbc:postgresql://localhost:5432/ebee_db_test
          DB_USERNAME=ebee
          DB_PASSWORD=ebee_test
          REDIS_HOST=localhost
          REDIS_PORT=6379
          JWT_SECRET=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciB0ZXN0aW5nIHB1cnBvc2VzIG9ubHkgMzI2IGJpdHM=
          JWT_RESET_SECRET=dGhpcyBpcyBhbm90aGVyIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciByZXNldCB0b2tlbnMgb25seSAzMjYgYml0cw==
          SUPER_ADMIN_EMAIL=super@ebee.lk
          SUPER_ADMIN_PASSWORD=TestAdmin@123
          EOF

      - name: Build and verify
        run: ./mvnw verify -q --batch-mode --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: test
          # application-test.yml points at a developer's local database (ebee_test / local user).
          # OS env vars take precedence over profile files, so point Spring at the CI services instead.
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ebee_db_test
          SPRING_DATASOURCE_USERNAME: ebee
          SPRING_DATASOURCE_PASSWORD: ebee_test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
