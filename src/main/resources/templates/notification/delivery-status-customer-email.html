<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
  .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .header { background: #1a73e8; padding: 32px 40px; text-align: center; }
  .header h1 { color: #ffffff; margin: 0; font-size: 24px; }
  .body { padding: 32px 40px; color: #333333; line-height: 1.6; }
  .body p { margin: 8px 0; }
  .status-box { background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 20px; margin: 16px 0; text-align: center; }
  .status-box .status-label { font-size: 14px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
  .status-box .status-value { font-size: 20px; font-weight: bold; color: #16a34a; margin-top: 4px; }
  .message-block { margin: 16px 0; }
  .footer { padding: 24px 40px; text-align: center; color: #888888; font-size: 13px; border-top: 1px solid #e0e0e0; }
  .footer p { margin: 4px 0; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>Delivery Update</h1></div>
  <div class="body">
    <p>Hi {{firstName}}!</p>
    <p>Your order <strong>{{orderNumber}}</strong> has a delivery update.</p>
    <div class="status-box">
      <div class="status-label">Delivery Status</div>
      <div class="status-value">{{statusLabel}}</div>
    </div>
    <div class="message-block">{{messageBlock}}</div>
    <p>Thank you for choosing Ebee. If you have any questions, please contact our support team.</p>
  </div>
  <div class="footer">
    <p>&copy; 2026 Ebee. All rights reserved.</p>
  </div>
</div>
</body>
</html>
