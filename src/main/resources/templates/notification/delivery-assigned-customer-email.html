<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
  .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .header { background: #1a73e8; padding: 32px 40px; text-align: center; }
  .header h1 { color: #ffffff; margin: 0; font-size: 24px; }
  .body { padding: 32px 40px; color: #333333; line-height: 1.6; }
  .body p { margin: 8px 0; }
  .footer { padding: 24px 40px; text-align: center; color: #888888; font-size: 13px; border-top: 1px solid #e0e0e0; }
  .footer p { margin: 4px 0; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>Delivery Driver Assigned</h1></div>
  <div class="body">
    <p>Hi {{firstName}}!</p>
    <p>Your order <strong>{{orderNumber}}</strong> has been assigned to a driver for delivery. You will receive further updates as your order progresses.</p>
    <p>Thank you for choosing Ebee!</p>
  </div>
  <div class="footer">
    <p>&copy; 2026 Ebee. All rights reserved.</p>
  </div>
</div>
</body>
</html>
