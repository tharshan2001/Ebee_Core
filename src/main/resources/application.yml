spring:
  application:
    name: ebee
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ebee_db
    username: antonabitharshan
    password:
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

aws:
  access-key: ${AWS_ACCESS_KEY:your-access-key}
  secret-key: ${AWS_SECRET_KEY:your-secret-key}
  region: eu-north-1
  bucket-name: pathfinder-app-media

server:
  port: 8085

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: 86400000
  refreshExpiration: 604800000

logging:
  level:
    com.ebee: DEBUG
    org.springframework.security: INFO
