spring:
  application:
    name: ebee
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ebee_db
    username: antonabitharshan
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

aws:
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION:eu-north-1}
  bucket-name: ${AWS_BUCKET_NAME:pathfinder-app-media}

server:
  port: 8085

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refreshExpiration: 604800000

notification:
  sms:
    api-base-url: ${DIALOG_SMS_API_URL:https://richcommunication.dialog.lk/api}
    username: ${DIALOG_SMS_USERNAME}
    password: ${DIALOG_SMS_PASSWORD}
    default-mask: ${DIALOG_SMS_MASK:KISMET PLUS}
    default-campaign: ${DIALOG_SMS_CAMPAIGN:Notification}

logging:
  level:
    com.ebee: DEBUG
    org.springframework.security: INFO
