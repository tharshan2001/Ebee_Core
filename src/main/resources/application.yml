spring:
  application:
    name: ebee
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ebee_db
    username: antonabitharshan
    password:
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8085

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

logging:
  level:
    com.ebee: DEBUG
    org.springframework.security: INFO
